<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Toy details</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #fffdf7;
            color: #303030;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background: #00277c;
            padding: 20px 7%;
            border-bottom: 1px solid #eadfba;
        }

        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .logo {
            font-size: 27px;
            font-weight: bold;
            color: #ffffff;
            margin: 0;
        }

        nav {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        nav a {
            text-decoration: none;
            background: #058ef1;
            color: #ffffff;
            padding: 10px 15px;
            border-radius: 5px;
            font-weight: 600;
            transition: 0.2s;
        }

        nav a:hover {
            background: #fb0202;
        }

        footer {
            background: #0a389c;
            border-top: 1px solid #eadfba;
            padding: 23px;
            text-align: center;
            margin-top: 55px;
            color: #ffffff;
        }

        .button,
        .btn {
            display: inline-block;
            background: #7d9ff3;
            color: #302b1b;
            padding: 13px 23px;
            border: none;
            border-radius: 5px;
            text-decoration: none;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .button:hover,
        .btn:hover {
            background: #f37f7f;
        }

        main {
            flex: 1;
            width: 100%;
        }

        main a {
            color: #0a389c;
        }

        main a.button,
        main a.btn {
            color: #302b1b;
        }

        main h1,
        main h2,
        main h3 {
            color: #00277c;
        }

        .error,
        .err {
            color: #fb0202;
        }

        .message,
        .msg {
            color: #0a389c;
            font-weight: bold;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: #0a389c;
            color: #ffffff;
            text-align: left;
            padding: 10px;
        }

        td {
            padding: 10px;
            border-bottom: 1px solid #d6e0fa;
        }

        .container {
            max-width: 1100px;
            margin: 45px auto;
            padding: 0 20px;
        }

        .container.narrow {
            max-width: 520px;
        }

        .panel {
            background: white;
            border: 1px solid #7d9ff3;
            border-radius: 10px;
            padding: 25px;
            margin-bottom: 25px;
        }

        .panel h1,
        .panel h2 {
            margin-top: 0;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 14px;
        }

        input,
        textarea {
            display: block;
            width: 100%;
            margin-top: 6px;
            padding: 10px;
            border: 1px solid #7d9ff3;
            border-radius: 5px;
            font: inherit;
        }

        input:focus,
        textarea:focus {
            outline: none;
            border-color: #0a389c;
        }

        small.error {
            display: block;
            margin: -8px 0 12px;
        }

        .tag {
            display: inline-block;
            background: #058ef1;
            color: #ffffff;
            padding: 3px 10px;
            border-radius: 5px;
            font-weight: bold;
            font-size: 13px;
        }

        .top-gap {
            margin-top: 20px;
        }

    </style>
</head>
<body>
<header>
    <div class="header-content">

        <h1 class="logo">RockyToys 🧸</h1>

        <nav>
            <a th:href="@{/}">Home</a>
            <a th:href="@{/toys}">Shop Toys</a>
            <a th:href="@{/cart}">My Cart</a>

            <a th:href="@{/users/profile}"
               th:if="${session.loggedInUser != null}">
                My Profile
            </a>

            <a th:href="@{/users/login}"
               th:if="${session.loggedInUser == null}">
                Login
            </a>

            <a th:href="@{/users/register}"
               th:if="${session.loggedInUser == null}">
                Register
            </a>

            <a th:href="@{/users/logout}"
               th:if="${session.loggedInUser != null}">
                Logout
            </a>

            <a th:href="@{/admin/carts}"
               th:if="${session.loggedInUser != null and session.loggedInUser.role == 'ADMIN'}">
                Manage Carts
            </a>
        </nav>

    </div>
</header>
<main class="container narrow">
    <section class="panel">
        <h1>Toy details / Edit</h1>
        <p><b>ID:</b>
            <span th:text="${toy.toyId}"></span>
        </p>
        <form th:if="${isAdmin}" th:action="@{/toys/update/{id}(id=${toy.toyId})}" method="post">
            <label>Name <input name="name" th:value="${toy.name}" required></label>
            <label>Description <input name="description" th:value="${toy.description}"></label>
            <label>Category ID <input name="categoryId" th:value="${toy.categoryId}" required></label>
            <label>Price <input name="price" type="number" min="0" step="0.01" th:value="${toy.price}" required></label>
            <label>Age group <input name="ageGroup" th:value="${toy.ageGroup}" required></label>
            <button class="button" type="submit">Save changes</button>
        </form>
        <p><a href="/toys">Back to toys</a></p>
    </section>
</main>


<footer>
    <p>© 2026 RockyToys. All Rights Reserved.</p>
    <p>Bringing Smiles Through Play! 🧸</p>
</footer>

</body>
</html>

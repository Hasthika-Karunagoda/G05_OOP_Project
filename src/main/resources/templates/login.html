<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header>
    <h1>RockyToys</h1>
    <p>Little things. Big smiles.</p>
    <nav>
        <a href="/">Home</a>
        <a href="/users/register">Register</a>
        <a href="/users/login">User login</a>
        <a href="/admin/login">Admin login</a>
    </nav>
</header>
<main class="container narrow">
    <section class="panel">
        <h1>Welcome back</h1>
        <p th:if="${message}" class="message" th:text="${message}"></p>
        <p th:if="${error}" class="error" th:text="${error}"></p>
        <form method="post" th:action="@{/users/login}" th:object="${loginDTO}">
            <label>Email<input type="email" th:field="*{email}" required></label>
            <small class="error" th:errors="*{email}"></small>
            <label>Password<input type="password" th:field="*{password}" required></label>
            <small class="error" th:errors="*{password}"></small>
            <button class="button" type="submit">Log in</button>
        </form>
        <p>New here? <a th:href="@{/users/register}">Create an account</a></p>
    </section>
</main>
</body>
</html>

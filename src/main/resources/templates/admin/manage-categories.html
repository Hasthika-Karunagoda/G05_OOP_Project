<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Manage Categories | RockyToys</title>
    <style>
        *{box-sizing:border-box}
        body{
            margin:0;
            font-family:Arial,sans-serif;
            background:#fffdf7;
            color:#303030
        }
        header,footer{
            background:#00277c;
            color:white;
            padding:20px 7%
        }
        header a{
            display:inline-block;
            background:#058ef1;
            color:white;
            text-decoration:none;
            padding:10px 15px;
            border-radius:5px;
            margin:4px
        }
        main{
            max-width:1100px;
            margin:40px auto;
            padding:0 20px
        }
        h1,h2{
            color:#00277c
        }
        .panel{
            background:white;
            border:1px solid #7d9ff3;
            border-radius:10px;
            padding:24px;
            margin-bottom:24px
        }
        input{
            width:100%;
            padding:10px;
            margin:6px 0 14px;
            border:1px solid #7d9ff3;
            border-radius:5px;
            font:inherit
        }

        label{
            display:block;
            font-weight:bold
        }
        .button{
            background:#7d9ff3;
            color:#302b1b;
            padding:10px 17px;
            border:0;
            border-radius:5px;
            font-weight:bold;
            cursor:pointer
        }
        .delete{
            background:#fb7777
        }
        .notice{
            font-weight:bold;
            color:#0a389c
        }
        .error {
            font-weight:bold;
            color:#d00000
        }
        .table-wrap{overflow-x:auto}
        table{
            width:100%;
            border-collapse:collapse
        }
        th{
            background:#0a389c;
            color:white;
            text-align:left;
            padding:11px
        }

        td{padding:11px;
            border-bottom:1px solid #d6e0fa;
            vertical-align:top
        }

        td form{min-width:180px}
        td input{min-width:160px}
        footer{text-align:center;margin-top:50px}
    </style>
</head>
<body>
<header><h1>RockyToys 🧸</h1>
    <a th:href="@{/}">Home</a>
    <a th:href="@{/toys}">Shop Toys</a>
    <a th:href="@{/categories}">View Categories</a>
</header>
<main>
    <h1>Manage Categories</h1>
    <p th:if="${message}" class="notice" th:text="${message}"></p>
    <p th:if="${error}" class="error" th:text="${error}"></p>
    <section class="panel">
        <h2>Add a category</h2>
        <form th:action="@{/admin/categories/add}" method="post">
            <label>Category name<input name="categoryName" maxlength="50" required placeholder="e.g. Building Blocks"></label>
            <label>Description<input name="description" maxlength="200" placeholder="Short description"></label>
            <button class="button" type="submit">Add Category</button>
        </form>
    </section>
    <section class="panel">
        <h2>Existing categories</h2>
        <div class="table-wrap"><table>
            <thead><tr><th>ID</th><th>Update category</th><th>Delete</th></tr></thead>
            <tbody>
            <tr th:each="category : ${categories}">
                <td th:text="${category.categoryId}"></td>
                <td>
                    <form th:action="@{/admin/categories/update/{id}(id=${category.categoryId})}" method="post">
                        <label>Name<input name="categoryName" maxlength="50" th:value="${category.categoryName}" required></label>
                        <label>Description<input name="description" maxlength="200" th:value="${category.description}"></label>
                        <button class="button" type="submit">Save Changes</button>
                    </form>
                </td>
                <td>
                    <form th:action="@{/admin/categories/delete/{id}(id=${category.categoryId})}" method="post">
                        <button class="button delete" type="submit">Delete</button>
                    </form>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(categories)}"><td colspan="3">No categories added yet.</td></tr>
            </tbody>
        </table></div>
    </section>
</main>
<footer>© 2026 RockyToys. Bringing Smiles Through Play! 🧸</footer>
</body>
</html>
